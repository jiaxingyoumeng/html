<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doremi婚礼管理 - 产品原型</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --line: #e9edf4;
      --text: #1f2937;
      --sub: #6b7280;
      --primary: #409eff;
      --nav: #1f3f6f;
      --nav-deep: #16335d;
      --success: #53c26b;
      --warn: #f1b13f;
      --danger: #ff6b6b;
      --shadow: 0 10px 20px rgba(31, 41, 55, 0.05);
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .app {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    aside {
      background: linear-gradient(180deg, var(--nav-deep), var(--nav));
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    .brand {
      height: 76px;
      font-size: 32px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 1px;
    }

    .menu-group { padding: 10px 0; }
    .menu-item {
      width: 100%;
      border: 0;
      background: transparent;
      color: #dbe7ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      cursor: pointer;
      font-size: 18px;
    }

    .menu-item:hover, .menu-item.active { background: rgba(64, 158, 255, 0.22); color: #fff; }
    .submenu {
      display: none;
      padding: 4px 0 8px;
      background: rgba(0, 0, 0, 0.08);
    }
    .submenu.open { display: block; }
    .submenu a {
      display: block;
      color: #c9d9ff;
      text-decoration: none;
      padding: 8px 56px;
      font-size: 15px;
    }
    .submenu a:hover { color: #fff; }

    main { display: flex; flex-direction: column; }

    .topbar {
      height: 68px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .crumb { font-size: 26px; font-weight: 700; color: #334155; }
    .crumb small { color: #9aa4b2; font-weight: 600; }

    .top-actions { display: flex; align-items: center; gap: 16px; }

    .icon-btn {
      position: relative;
      border: 1px solid var(--line);
      background: #fff;
      height: 42px;
      width: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--danger);
      color: #fff;
      border-radius: 99px;
      font-size: 12px;
      padding: 2px 6px;
    }

    .user {
      border: 1px solid #d6deea;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px 6px 6px;
      cursor: pointer;
    }
    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .pop {
      display: none;
      position: absolute;
      right: 0;
      top: 52px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      min-width: 220px;
      overflow: hidden;
    }
    .pop.open { display: block; }
    .pop a, .pop button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 12px 14px;
      cursor: pointer;
      color: #334155;
    }
    .pop a:hover, .pop button:hover { background: #f5f8fd; }

    .content { padding: 22px; display: grid; gap: 18px; }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .stat {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .stat .i {
      width: 62px;
      height: 62px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 30px;
    }
    .stat h4 { margin: 0; color: #34465d; font-size: 26px; }
    .stat p { margin: 6px 0 0; color: var(--sub); font-size: 14px; }

    .two-col {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }

    .panel {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 18px;
    }
    .panel h3 { margin: 2px 0 12px; font-size: 28px; }

    .chart-wrap { height: 360px; }
    svg text { fill: #6b7280; font-size: 13px; }

    .legend {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
      font-size: 15px;
      color: #4b5563;
    }
    .legend i {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: -2px;
    }

    .lower {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .quick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 8px;
    }
    .quick button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
    }
    .quick b { display: block; font-size: 17px; margin-bottom: 6px; }
    .quick span { color: var(--sub); }

    .todo-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .tabs button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 11px;
      cursor: pointer;
      margin-left: 6px;
    }
    .tabs button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .todo-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid #edf1f7;
      font-size: 16px;
    }
    .tag {
      border-radius: 6px;
      font-size: 12px;
      padding: 2px 8px;
      margin-right: 8px;
      color: #fff;
    }

    dialog {
      border: none;
      border-radius: 12px;
      width: min(560px, 90vw);
      padding: 0;
    }
    dialog::backdrop { background: rgba(2, 6, 23, 0.45); }
    .modal-body { padding: 20px; }
    .modal-body h4 { margin: 0 0 12px; }
    .form-grid { display: grid; gap: 10px; }
    .form-grid input, .form-grid textarea, .form-grid select {
      width: 100%;
      border: 1px solid #d7e0ec;
      border-radius: 8px;
      padding: 10px;
      font: inherit;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .btn {
      border: 1px solid #d3dce9;
      border-radius: 8px;
      background: #fff;
      padding: 8px 14px;
      cursor: pointer;
    }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }

    @media (max-width: 1200px) {
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .two-col, .lower { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">Doremi婚礼管理</div>
      <div class="menu-group" id="menu"></div>
    </aside>

    <main>
      <header class="topbar">
        <div class="crumb">首页 <small>/ 控制台</small></div>
        <div class="top-actions">
          <div style="position:relative">
            <button class="icon-btn" id="notifyBtn">🔔<span class="badge" id="badge">3</span></button>
            <div class="pop" id="notifyPop"></div>
          </div>
          <div style="position:relative">
            <button class="user" id="userBtn">
              <span class="avatar">管</span>
              <strong>管理员</strong>
              <span>⌄</span>
            </button>
            <div class="pop" id="userPop">
              <a href="#">个人资料</a>
              <a href="#">账号设置</a>
              <button>退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <section class="content">
        <div class="cards" id="stats"></div>

        <div class="two-col">
          <article class="panel">
            <h3>订单趋势</h3>
            <div class="chart-wrap">
              <svg id="lineChart" viewBox="0 0 840 340" width="100%" height="100%"></svg>
            </div>
          </article>

          <article class="panel">
            <h3>订单类型分布</h3>
            <div class="chart-wrap" style="height:300px">
              <svg id="donut" viewBox="0 0 360 280" width="100%" height="100%"></svg>
            </div>
            <div class="legend" id="legend"></div>
          </article>
        </div>

        <div class="lower">
          <article class="panel">
            <h3>快捷入口</h3>
            <div class="quick" id="quick"></div>
          </article>

          <article class="panel">
            <div class="todo-toolbar">
              <h3 style="margin:0">待办事项</h3>
              <div class="tabs" id="tabs"></div>
            </div>
            <div id="todo"></div>
          </article>
        </div>
      </section>
    </main>
  </div>

  <dialog id="taskModal">
    <div class="modal-body">
      <h4>新建跟进任务</h4>
      <div class="form-grid">
        <input id="mTitle" placeholder="任务标题" />
        <select id="mLevel">
          <option>普通</option>
          <option>紧急</option>
          <option>低</option>
        </select>
        <input id="mTime" type="datetime-local" />
        <textarea id="mDesc" rows="3" placeholder="任务备注"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="taskModal.close()">取消</button>
        <button class="btn primary" id="saveTask">保存</button>
      </div>
    </div>
  </dialog>

  <script>
    const menuData = [
      { name: '首页', icon: '🏠', active: true },
      { name: '订单管理', icon: '📄', children: ['订单列表', '订单分配', '进度跟踪'] },
      { name: '案例管理', icon: '🖼️', children: ['婚礼案例', '摄影样片', '视频素材'] },
      { name: '资讯管理', icon: '🧾', children: ['活动资讯', '公告通知'] },
      { name: '系统管理', icon: '⚙️', children: ['角色权限', '参数配置', '操作日志'] },
    ];

    const stats = [
      { title: '今日订单', value: '128', icon: '📋', bg: '#ecf4ff' },
      { title: '本月营收', value: '¥586,320', icon: '💰', bg: '#fff5e5' },
      { title: '新增客户', value: '45', icon: '👥', bg: '#f0f7ff' },
      { title: '待处理相册', value: '12', icon: '📷', bg: '#f5f2ff' },
    ];

    const trend = [120, 130, 102, 134, 92, 228, 210, 182, 190, 234, 260, 280];
    const pie = [
      { name: '婚礼策划', value: 35, color: '#409eff' },
      { name: '婚纱摄影', value: 25, color: '#66c24f' },
      { name: '婚礼跟拍', value: 22, color: '#e3a446' },
      { name: '婚纱租赁', value: 18, color: '#8b919a' },
    ];

    let todos = [
      { level: '紧急', text: '张先生婚礼方案确认', time: '今天 14:00' },
      { level: '普通', text: '李女士婚纱照选片', time: '今天 16:30' },
      { level: '普通', text: '王先生婚礼场地勘察', time: '明天 10:00' },
      { level: '低', text: '本周订单数据统计', time: '周五前' },
    ];

    const colors = { 紧急: '#ff6b6b', 普通: '#53c26b', 低: '#f1a340' };

    const menuEl = document.querySelector('#menu');
    menuData.forEach((m) => {
      const item = document.createElement('button');
      item.className = `menu-item ${m.active ? 'active' : ''}`;
      item.innerHTML = `<span>${m.icon} ${m.name}</span><span>${m.children ? '⌄' : ''}</span>`;
      menuEl.appendChild(item);
      if (m.children) {
        const sub = document.createElement('div');
        sub.className = 'submenu';
        sub.innerHTML = m.children.map((c) => `<a href="#">${c}</a>`).join('');
        menuEl.appendChild(sub);
        item.onclick = () => sub.classList.toggle('open');
      }
    });

    document.querySelector('#stats').innerHTML = stats.map((s) => `
      <article class="stat">
        <div class="i" style="background:${s.bg}">${s.icon}</div>
        <div>
          <p>${s.title}</p>
          <h4>${s.value}</h4>
        </div>
      </article>
    `).join('');

    const quick = [
      ['📋', '订单管理', '查看和处理订单', () => alert('进入订单列表')],
      ['📷', '图册管理', '管理婚礼相册', () => alert('进入图册管理')],
      ['📊', '数据统计', '查看经营数据', () => alert('进入数据看板')],
      ['⚙️', '系统设置', '管理系统配置', () => alert('进入系统设置')],
      ['➕', '新建任务', '添加待办事项', () => taskModal.showModal()],
      ['🧾', '导出报表', '导出本月经营报表', () => alert('已开始导出')],
    ];
    const quickEl = document.querySelector('#quick');
    quick.forEach(([icon, title, text, handler]) => {
      const b = document.createElement('button');
      b.innerHTML = `<b>${icon} ${title}</b><span>${text}</span>`;
      b.onclick = handler;
      quickEl.appendChild(b);
    });

    function drawLineChart() {
      const svg = document.querySelector('#lineChart');
      const W = 840, H = 340;
      const left = 52, right = 20, top = 20, bottom = 44;
      const innerW = W - left - right;
      const innerH = H - top - bottom;
      const max = 300;

      let html = '';
      for (let i = 0; i <= 6; i++) {
        const y = top + (innerH / 6) * i;
        const val = max - (max / 6) * i;
        html += `<line x1="${left}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#e8edf5"/>`;
        html += `<text x="16" y="${y + 4}">${Math.round(val)}</text>`;
      }

      const pts = trend.map((v, i) => {
        const x = left + (innerW / (trend.length - 1)) * i;
        const y = top + innerH * (1 - v / max);
        return [x, y];
      });
      const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
      const area = `${path} L${pts[pts.length - 1][0]},${H-bottom} L${pts[0][0]},${H-bottom} Z`;

      html += `<path d="${area}" fill="rgba(64, 158, 255, 0.14)"/>`;
      html += `<path d="${path}" fill="none" stroke="#409eff" stroke-width="3"/>`;

      pts.forEach((p, i) => {
        html += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#409eff" stroke-width="2"/>`;
        html += `<text x="${p[0]-9}" y="${H-20}">${i + 1}月</text>`;
      });

      svg.innerHTML = html;
    }

    function arc(cx, cy, r, start, end) {
      const s = (start - 90) * Math.PI / 180;
      const e = (end - 90) * Math.PI / 180;
      const x1 = cx + r * Math.cos(s), y1 = cy + r * Math.sin(s);
      const x2 = cx + r * Math.cos(e), y2 = cy + r * Math.sin(e);
      const large = end - start > 180 ? 1 : 0;
      return `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2}`;
    }

    function drawDonut() {
      const svg = document.querySelector('#donut');
      let html = '';
      let current = 0;
      pie.forEach((p) => {
        const start = current * 3.6;
        current += p.value;
        const end = current * 3.6 - 4;
        html += `<path d="${arc(170, 140, 86, start, end)}" stroke="${p.color}" stroke-width="44" fill="none" stroke-linecap="round"/>`;
      });
      svg.innerHTML = html;
      document.querySelector('#legend').innerHTML = pie.map(p => `<div><i style="background:${p.color}"></i>${p.name} (${p.value}%)</div>`).join('');
    }

    const tabs = ['全部', '紧急', '普通', '低'];
    let activeTab = '全部';
    const tabsEl = document.querySelector('#tabs');

    function renderTabs() {
      tabsEl.innerHTML = tabs.map((t) => `<button class="${t===activeTab ? 'active' : ''}">${t}</button>`).join('');
      [...tabsEl.children].forEach((el) => {
        el.onclick = () => { activeTab = el.textContent; renderTabs(); renderTodo(); };
      });
    }

    function renderTodo() {
      const list = activeTab === '全部' ? todos : todos.filter(t => t.level === activeTab);
      document.querySelector('#todo').innerHTML = list.map((t) => `
        <div class="todo-item">
          <div><span class="tag" style="background:${colors[t.level]}">${t.level}</span>${t.text}</div>
          <small style="color:#64748b">${t.time}</small>
        </div>
      `).join('') || '<p style="color:#94a3b8">当前筛选无任务。</p>';
      document.querySelector('#badge').textContent = todos.filter(t => t.level === '紧急').length;
    }

    const notices = [
      '新的婚礼订单已分配给策划组。',
      '3 个客户留言待回复。',
      '本月营收报表可下载。'
    ];
    document.querySelector('#notifyPop').innerHTML = notices.map(n => `<a href="#">${n}</a>`).join('') + '<button id="markRead">全部标记已读</button>';
    document.querySelector('#markRead').onclick = () => {
      notices.length = 0;
      document.querySelector('#notifyPop').innerHTML = '<a href="#">暂无未读通知</a>';
      document.querySelector('#badge').textContent = '0';
    };

    document.querySelector('#notifyBtn').onclick = (e) => {
      e.stopPropagation();
      document.querySelector('#notifyPop').classList.toggle('open');
      document.querySelector('#userPop').classList.remove('open');
    };
    document.querySelector('#userBtn').onclick = (e) => {
      e.stopPropagation();
      document.querySelector('#userPop').classList.toggle('open');
      document.querySelector('#notifyPop').classList.remove('open');
    };
    document.body.onclick = () => {
      document.querySelector('#notifyPop').classList.remove('open');
      document.querySelector('#userPop').classList.remove('open');
    };

    document.querySelector('#saveTask').onclick = () => {
      const title = document.querySelector('#mTitle').value.trim();
      const level = document.querySelector('#mLevel').value;
      const time = document.querySelector('#mTime').value;
      if (!title) return alert('请输入任务标题');
      todos.unshift({
        level,
        text: title,
        time: time ? new Date(time).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '待安排'
      });
      taskModal.close();
      document.querySelector('#mTitle').value = '';
      document.querySelector('#mDesc').value = '';
      renderTodo();
    };

    drawLineChart();
    drawDonut();
    renderTabs();
    renderTodo();
  </script>
</body>
</html>
