<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户管理</title><link rel="stylesheet" href="assets/app.css"></head><body>
<div class="app"><aside><div class="brand">Doremi婚礼</div><nav id="menu" class="menu"></nav></aside><main>
<header class="topbar"><h3>客户管理</h3><div class="muted">线索筛选、阶段推进、转订单</div></header>
<section class="content"><div id="notice" class="notice"></div>
<article class="panel"><div class="toolbar"><input id="kw" placeholder="搜索客户"><select id="stage"><option>全部</option><option>新线索</option><option>已邀约</option><option>已到店</option></select><button class="primary" id="add">新增线索</button></div></article>
<article class="panel"><div id="list" class="list"></div></article>
</section></main></div>
<script src="assets/app.js"></script><script>
nav('customers.html');
const next={新线索:'已邀约',已邀约:'已到店',已到店:'已到店'};
function render(){const s=Store.load();const k=kw.value.trim();const f=stage.value;const arr=s.leads.filter(l=>(!k||l.name.includes(k))&&(f==='全部'||l.stage===f));list.innerHTML=arr.map(l=>`<div class="item"><div><b>${l.name}</b> <span class="badge ${statusBadge(l.stage)}">${l.stage}</span><div class="muted">下一步：${l.next}</div></div><div class="toolbar"><button onclick="promote('${l.name}')">推进</button><button onclick="convert('${l.name}')">转订单</button></div></div>`).join('')||'<div class="muted">暂无客户</div>'}
window.promote=(name)=>{const s=Store.load();const l=s.leads.find(x=>x.name===name);if(!l)return;l.stage=next[l.stage];Store.save({leads:s.leads});render();notice('客户阶段已推进');};
window.convert=(name)=>{const s=Store.load();const l=s.leads.find(x=>x.name===name);if(!l)return;s.orders.unshift({id:'OD'+Math.floor(Math.random()*90000+10000),customer:name,pkg:'咨询转化套餐',status:'待签约',amount:15800});s.newLeads=Math.max(0,Number(s.newLeads)-1);Store.save({orders:s.orders,newLeads:s.newLeads});notice('已转为订单（可去订单页查看）');};
kw.oninput=render;stage.onchange=render;add.onclick=()=>{const s=Store.load();s.leads.unshift({name:'新增客户'+Math.floor(Math.random()*90+10),stage:'新线索',next:'24小时内首联'});s.newLeads=Number(s.newLeads)+1;Store.save({leads:s.leads,newLeads:s.newLeads});render();notice('线索创建成功');};
window.addEventListener('store:change',render);render();
</script></body></html>
